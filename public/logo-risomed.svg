<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" fill="none">
  <!-- Brand typography definition and vector curves -->
  <defs>
    <style>
      .brand-title {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 0.9;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        letter-spacing: 0.18em;
      }
    </style>
  </defs>

  <!-- Riso -->
  <text x="75" y="44" class="brand-title" font-size="37" fill="#00778B">Riso</text>

  <!-- med -->
  <text x="75" y="77" class="brand-title" font-size="37" fill="#00778B">med</text>

  <!-- Smile / Arc accent next to med: curve that forms the trademark smile -->
  <path d="M152 64 C 158 72, 161 78, 153 84" stroke="#00778B" stroke-width="4.2" stroke-linecap="round" fill="none" />

  <!-- odonto descriptor underneath -->
  <text x="75" y="93" class="brand-sub" font-size="12" fill="#E87722">odonto</text>
</svg>
