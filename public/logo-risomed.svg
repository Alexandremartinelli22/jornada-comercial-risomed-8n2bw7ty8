<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" width="440" height="160" fill="none">
  <!-- Wordmark "Risomed" em uma única palavra, fonte geométrica arredondada -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
      .risomed-wordmark {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
    </style>
  </defs>

  <g id="risomed-logo">
    <!-- Texto "Risomed" -->
    <text
      x="28"
      y="90"
      class="risomed-wordmark"
      font-size="78"
      fill="#1B2E5A"
    >Risomed</text>

    <!-- Grande arco de sorriso elegante por baixo do texto, estilo smile/swoosh:
         Inicia abaixo da perna do 'R' (x≈40, y≈102),
         desce em arco amplo harmonioso (ponto mais baixo x≈210, y≈142),
         e sobe suavemente até a direita abaixo do 'd' (x≈378, y≈124) -->
    <path
      d="M 38 102 C 55 130, 125 144, 210 144 C 295 144, 348 132, 382 122"
      stroke="#1B2E5A"
      stroke-width="5.5"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>