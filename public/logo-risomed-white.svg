<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" width="440" height="160" fill="none">
  <!-- Wordmark "Risomed" em branco (para fundos escuros) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
      .risomed-wordmark {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
    </style>
  </defs>

  <g id="risomed-logo-white">
    <!-- Texto "Risomed" -->
    <text
      x="28"
      y="90"
      class="risomed-wordmark"
      font-size="78"
      fill="#FFFFFF"
    >Risomed</text>

    <!-- Grande arco de sorriso elegante em branco por baixo do texto -->
    <path
      d="M 38 102 C 55 130, 125 144, 210 144 C 295 144, 348 132, 382 122"
      stroke="#FFFFFF"
      stroke-width="5.5"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>