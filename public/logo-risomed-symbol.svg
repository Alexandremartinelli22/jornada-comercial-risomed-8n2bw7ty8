<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Fundo azul-marinho arredondado da Risomed -->
  <rect width="64" height="64" rx="16" fill="#1B2E5A"/>
  
  <!-- Letra 'R' maiúscula elegante e arredondada no topo/centro -->
  <text
    x="32"
    y="39"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="700"
    font-size="34"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="-0.02em"
  >R</text>

  <!-- Grande arco de sorriso (smile/swoosh) estilizado na base -->
  <path
    d="M 15 44 C 20 53, 30 56, 44 53 C 48 52, 51 50, 53 48"
    stroke="#29AABE"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />
</svg>